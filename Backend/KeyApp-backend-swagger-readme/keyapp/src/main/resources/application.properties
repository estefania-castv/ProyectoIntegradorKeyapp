# ============================================================
# KeyApp - configuracion
# Los valores despues de ":" son los de desarrollo local.
# En la nube se definen como variables de entorno (DB_URL, DB_USER, ...).
# ============================================================

# ---------- Base de datos ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/keyapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "none": Hibernate NO crea ni modifica tablas (los cambios de estructura se hacen en MySQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Seguridad (JWT) ----------
# En la nube: JWT_SECRET con minimo 32 caracteres aleatorios y secreto
jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-0123456789abcdef}
# Duracion del token en milisegundos (28800000 = 8 horas)
jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}

# ---------- CORS ----------
# URL(s) del frontend separadas por coma. En la nube: la URL publica del frontend.
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# ---------- Servidor ----------
server.port=${PORT:8080}

# ---------- Reportes estadisticos con Python ----------
app.python.ejecutable=${PYTHON_EXECUTABLE:python}
app.python.api-url=${KEYAPP_API_URL:http://localhost:8080/api}

# ---------- Documentacion de la API (Swagger) ----------
# Interfaz: http://localhost:8080/doc/swagger-ui/index.html (la aplicacion debe estar en ejecucion)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
